[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-talent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0",
    "sqlalchemy-bigquery>=1.9",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "slack-bolt>=1.18",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "statsmodels>=0.14",
    "python-pptx>=0.6.21",
    "markdown>=3.6",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "spacy>=3.7",
    "sentence-transformers>=3.0",
    "snowflake-sqlalchemy>=1.5",
    "python-json-logger>=2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
